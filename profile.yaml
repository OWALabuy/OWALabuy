# Content source for the generated GitHub profile SVG.
#
# Every entry under `rows` occupies one visual line, including rules and spacers.
# Keep no more than 16 uncommented entries. Reorder, delete, or comment out rows
# freely; the renderer should not attach special meaning to particular labels.

profile:
  ascii_file: tux.txt
  max_rows: 16

theme:
  name: gruvbox
  dark:
    background: "#282828"
    foreground: "#ebdbb2"
    label: "#fabd2f"
    accent: "#b8bb26"
    muted: "#928374"
  light:
    background: "#fbf1c7"
    foreground: "#3c3836"
    label: "#b57614"
    accent: "#79740e"
    muted: "#928374"

rows:
  - { text: "OWALabuy@github", style: header }
  - { rule: true }
  - { label: OS,             value: "Linux / Windows 10 / Android" }
  - { label: Uptime,         value: "21 Years" }
  - { label: Occupations,    value: "Programmer / Adult Model" }
  - { label: Dev.Focus,      value: "AI product, infra" }
  - { label: Languages.Code, value: "TypeScript, Python, Lua" }
  - { label: AI.Tooling,     value: "Codex, Claude Code, Cursor" }
  - { label: Owner,          value: "Miniwan" }
  - { spacer: true }
  - { label: Email.Work,     value: "ouyangwenyi@mini1.cn" }
  - { label: Email.Personal, value: "owalabuy@gmail.com" }
  - { label: Website,        value: "owalabuy.tech" }
  - { label: Twitter,        value: "@OWALabuy" }
  - { label: Telegram,       value: "@OWALabuy" }
  - { label: Pornhub,        value: "pornhub.com/users/owalabuy" }

